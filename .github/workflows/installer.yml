name: Create new installer
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build'
        required: true
        default: 'v0.x.x'
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  portable:
    if: contains(github.event.release.tag_name || github.event.inputs.tag_name, '-multilingual.')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and verify multilingual portable package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
        run: python tools/package-portable.py --version "$($env:RELEASE_TAG.TrimStart('v'))" --repository "${{ github.repository }}" --output dist/portable
      - uses: actions/upload-artifact@v4
        with:
          name: multilingual-portable
          path: dist/portable
      - name: Upload verified portable assets
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
        run: gh release upload "$env:RELEASE_TAG" (Get-ChildItem dist/portable -File).FullName -R "${{ github.repository }}"
  release:
    if: github.repository == 'PathOfBuildingCommunity/PathOfBuilding-PoE2'
    runs-on: windows-latest
    steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                repository: 'PathOfBuildingCommunity/PathOfBuilding-Installer'
                ref: 'master'
                ssh-key: '${{ secrets.POB_INSTALLER_KEY }}'
            - name: Install NSIS
              run: |
                choco install nsis --yes
                echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            - name: Create installer
              run: 'python3 make_release.py --game-version 2'
            - name: Upload artifact
              run: >
                gh release upload ${{ github.event.release.tag_name || github.event.inputs.tag_name }} (Get-ChildItem Dist -File).FullName --clobber -R ${{ github.repository }};
