# docker compose -f compose.enhanced.yml up --build   ->  http://localhost:8080  (MCP: http://localhost:8080/mcp)
services:
  pob2:
    build:
      context: .
      dockerfile: docker/enhanced.Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
