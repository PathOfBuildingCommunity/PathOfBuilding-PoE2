[default]
path =
include-files = changelog.txt,LICENSE.md,help.txt
include-directories =

[runtime]
path = runtime
exclude-files = lua-profiler.lua,SimpleGraphic.cfg,Update.exe,imgui.ini,*.log,*.pid,*.obj
exclude-directories = runtime/SimpleGraphic/Screenshots

[program]
path = src
exclude-files = HeadlessWrapper.lua,LaunchInstall.lua,LaunchServer.lua,Settings.xml,_SimpleGraphic.def.lua,*.log,*.pid,*.obj
exclude-directories = src/Export,src/TreeData,src/Builds,src/Tests,src/luacov.stats.out,src/Data/TimelessJewelData/BrutalRestraint.bin,src/Data/TimelessJewelData/ElegantHubris.bin,src/Data/TimelessJewelData/GloriousVanity.bin,src/Data/TimelessJewelData/LethalPride.bin,src/Data/TimelessJewelData/MilitantFaith.bin,src/poe_api_response.json

[fonts]
path =
include-directories = assets/fonts,docs/licenses
include-files = NotoSans*-VF.ttf,NotoSans*-OFL.txt

[tree]
path = src
exclude-files = *.scm,export_lines.bat,log_lines_extract.txt,missingStats.txt,*.log,*.pid,*.obj
include-directories = src/TreeData
